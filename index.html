<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad Harmony | Brezplačna biološka uglasitev</title>
    <!-- Ikona (favicon) -->
    <!-- Podatki za lepši prikaz ob deljenju (Facebook, WhatsApp, itd.) -->
<meta property="og:title" content="Monad Harmony | Brezplačna uglasitev">
<meta property="og:description" content="Izračunajte svoja lunarna leta in se potopite v terapevtske frekvence s kromoterapijo.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://github.io">
<meta property="og:image" content="https://github.ioog-image.jpg">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌑</text></svg>">
    
    <style>
        body { 
            background: #05070a; 
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 15px; 
            margin: 0; 
            min-height: 100vh;
            transition: background 2s ease; /* Počasen, pomirjujoč prehod barv */
        }
        
        .box { 
            /* Učinek prosojnega stekla */
            background: rgba(10, 15, 25, 0.75); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            border: 1px solid rgba(214, 175, 55, 0.3); 
            padding: 30px; 
            border-radius: 24px; 
            max-width: 600px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 { font-variant: small-caps; letter-spacing: 4px; margin: 0 0 5px 0; font-size: 1.8em; color: #d4af37; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            margin: 25px 0; 
        }
        
        .f-btn { 
            padding: 18px 5px; 
            cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            font-weight: bold; 
            border-radius: 12px; 
            color: white; 
            transition: 0.3s;
            font-size: 0.95em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .f-btn:active { transform: scale(0.95); }

        .stop { 
            background: rgba(150, 0, 0, 0.6); 
            color: #fff; 
            width: 100%; 
            padding: 15px; 
            cursor: pointer; 
            border: 1px solid #f00; 
            margin-top: 15px; 
            font-weight: bold; 
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }

        #info { 
            margin-top: 25px; 
            min-height: 110px; 
            font-style: italic; 
            border-top: 1px solid rgba(212, 175, 55, 0.2); 
            padding-top: 20px;
            line-height: 1.6;
            font-size: 1.15em; 
            color: #f0f0f0;
        }

        .sig { margin-top: 30px; letter-spacing: 5px; opacity: 0.5; font-size: 0.7em; font-weight: bold; }

        input { padding: 12px; border: 1px solid #d4af37; background: rgba(0,0,0,0.5); color: #d4af37; border-radius: 8px; font-size: 1em; width: 60%; }
        button.calc-btn { background: #d4af37; color: #000; font-weight: bold; padding: 12px 20px; cursor: pointer; border: none; border-radius: 8px; font-size: 0.9em; margin-top: 10px; }

        #rezultat { text-align: left; margin-top: 20px; border-top: 1px solid rgba(212, 175, 55, 0.2); padding-top: 15px; font-size: 1.05em; }
        b { color: #d4af37; }

        @media (max-width: 450px) {
            .grid { grid-template-columns: 1fr 1fr; }
            h1 { font-size: 1.5em; }
            #info { font-size: 1.05em; }
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Monad Harmony</h1>
    <p style="opacity: 0.8; font-size: 0.9em; margin-bottom: 20px;"><i>Brezplačna kromoterapija in zvočna uglasitev</i></p>

    <div style="margin: 10px 0 25px 0;">
        <input type="date" id="datum" value="1975-11-21">
        <button class="calc-btn" onclick="izracunaj()">UGLASI ME</button>
        
        <div id="rezultat" style="display:none;">
            <p>• Lunarna starost: <b id="r1"></b> let</p>
            <p>• Cikli zorenja (266 dni): <b id="r2"></b></p>
            <p>• Naslednja biološka prenova: <b id="r3"></b></p>
        </div>
    </div>

    <div class="grid">
        <button class="f-btn" style="background:#333" onclick="igraj(174, '174 Hz: Naravni anestetik. Zmanjšuje fizično bolečino in daje organom občutek varnosti.', '#12121a')">174 Hz</button>
        <button class="f-btn" style="background:#7a4a00" onclick="igraj(285, '285 Hz: Regeneracija celic. Pomaga pri celjenju tkiv in obnavljanju energijskega polja.', '#2a1a00')">285 Hz</button>
        <button class="f-btn" style="background:#b30000" onclick="igraj(396, '396 Hz: Osvobajanje strahu. Odpravlja globoke podzavestne blokade in krivdo.', '#4a0000')">396 Hz</button>
        <button class="f-btn" style="background:#e69500; color: #000;" onclick="igraj(417, '417 Hz: Odpravljanje negativnosti. Spodbuja spremembe in čisti travmatične izkušnje.', '#4a2d00')">417 Hz</button>
        <button class="f-btn" style="background:#5c5c5c" onclick="igraj(432, '432 Hz: Harmonija narave. Frekvenca, ki usklajuje srčni utrip in prinaša globok mir.', '#1a221a')">432 Hz</button>
        <button class="f-btn" style="background:#008f00" onclick="igraj(528, '528 Hz: Čudežna frekvenca. Uporablja se za popravljanje DNK in prebujanje ljubezni.', '#003300')">528 Hz</button>
        <button class="f-btn" style="background:#0077b3" onclick="igraj(639, '639 Hz: Povezovanje odnosov. Izboljšuje komunikacijo in spodbuja strpnost.', '#00263a')">639 Hz</button>
        <button class="f-btn" style="background:#0000cc" onclick="igraj(741, '741 Hz: Intuicija in resnica. Čisti celice strupov in spodbuja duhovno izražanje.', '#00004a')">741 Hz</button>
        <button class="f-btn" style="background:#8000cc" onclick="igraj(852, '852 Hz: Duhovna uglasitev. Omogoča vpogled v višje ravni bivanja in krepi intuicijo.', '#26003d')">852 Hz</button>
        <button class="f-btn" style="background:#cc00cc" onclick="igraj(963, '963 Hz: Božanska zavest. Aktivira češariko in povezuje z izvorno svetlobo.', '#3d003d')">963 Hz</button>
    </div>

    <button class="stop" onclick="ustavi()">Ustavi zvok in barve</button>
    <div id="info">Izberite frekvenco za globoko barvno in zvočno terapijo.</div>

    <div class="sig">KARAT DESIGN SOFT • 2024</div>
</div>

<script>
    let avdio = null;
    let oscilator = null;
    let ojacanje = null;

    function igraj(f, opis, barva) {
        if (!avdio) { avdio = new (window.AudioContext || window.webkitAudioContext)(); }
        if (avdio.state === 'suspended') { avdio.resume(); }
        
        ustavi();

        // Celozaslonska barvna terapija
        document.body.style.background = barva;
        document.getElementById('info').innerHTML = "<strong>" + opis + "</strong>";

        oscilator = avdio.createOscillator();
        ojacanje = avdio.createGain();
        
        oscilator.type = 'sine';
        oscilator.frequency.value = f;
        
        // Mehak vklop zvoka
        ojacanje.gain.setValueAtTime(0, avdio.currentTime);
        ojacanje.gain.linearRampToValueAtTime(0.06, avdio.currentTime + 0.2);
        
        oscilator.connect(ojacanje);
        ojacanje.connect(avdio.destination);
        oscilator.start();
    }

    function ustavi() {
        if (oscilator) { 
            ojacanje.gain.linearRampToValueAtTime(0, avdio.currentTime + 0.2);
            oscilator.stop(avdio.currentTime + 0.3); 
            oscilator = null; 
        }
        document.body.style.background = "#05070a";
        document.getElementById('info').innerText = "Izberite frekvenco za globoko barvno in zvočno terapijo.";
    }

    function izracunaj() {
        const d = new Date(document.getElementById('datum').value);
        const danes = new Date();
        const razlikaDni = Math.floor((danes - d) / (1000 * 60 * 60 * 24));
        const cikel = Math.floor(razlikaDni / 266) + 1;
        const naslednji = new Date(d);
        naslednji.setDate(d.getDate() + (cikel * 266));

        document.getElementById('r1').innerText = (razlikaDni / 354.37).toFixed(1);
        document.getElementById('r2').innerText = (razlikaDni / 266).toFixed(1);
        document.getElementById('r3').innerText = naslednji.toLocaleDateString('sl-SI');
        document.getElementById('rezultat').style.display = 'block';
    }
</script>

</body>
</html>
