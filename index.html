<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARAT DESIGN - Monad Harmony</title>
    <style>
        body { 
            background: #05070a; 
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            margin: 0; 
            min-height: 100vh;
            transition: background 1.5s ease;
        }
        
        .box { 
            background: #12161f; 
            border: 1px solid #d4af37; 
            padding: 30px; 
            border-radius: 20px; 
            max-width: 600px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center; 
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.15);
            margin-top: 10px;
        }

        h1 { font-variant: small-caps; letter-spacing: 4px; margin-bottom: 5px; font-size: 1.8em; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            margin: 25px 0; 
        }
        
        .f-btn { 
            padding: 18px 5px; 
            cursor: pointer; 
            border: 1px solid rgba(212, 175, 55, 0.2); 
            font-weight: bold; 
            border-radius: 12px; 
            color: white; 
            transition: 0.3s;
            font-size: 1em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .f-btn:active { transform: scale(0.95); }

        .stop { 
            background: #500; 
            color: #ffbaba; 
            width: 100%; 
            padding: 15px; 
            cursor: pointer; 
            border: 1px solid #f00; 
            margin-top: 10px; 
            font-weight: bold; 
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #info { 
            margin-top: 25px; 
            min-height: 100px; /* Več prostora za besedilo */
            font-style: italic; 
            border-top: 1px solid rgba(212, 175, 55, 0.3); 
            padding-top: 20px;
            line-height: 1.6;
            font-size: 1.2em; /* Večja pisava za opise */
            color: #eee;
        }

        .sig { margin-top: 35px; letter-spacing: 5px; opacity: 0.6; font-size: 0.75em; font-weight: bold; }

        input { padding: 12px; border: 1px solid #d4af37; background: #000; color: #d4af37; border-radius: 8px; font-size: 1em; width: 60%; }
        button.calc-btn { background: #d4af37; color: #000; font-weight: bold; padding: 12px 20px; cursor: pointer; border: none; border-radius: 8px; font-size: 0.9em; margin-top: 10px; }

        #rezultat { text-align: left; margin-top: 20px; border-top: 1px solid rgba(212, 175, 55, 0.3); padding-top: 15px; font-size: 1.1em; }
        b { color: #d4af37; text-shadow: 0 0 8px rgba(212, 175, 55, 0.5); }

        @media (max-width: 400px) {
            .grid { grid-template-columns: 1fr 1fr; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Monad Harmony</h1>
    <p style="opacity: 0.8; font-size: 0.95em;"><i>Brezplačna uglasitev frekvenc, barv in telesnih ciklov</i></p>

    <div style="margin: 20px 0;">
        <input type="date" id="datum" value="1975-11-21">
        <button class="calc-btn" onclick="izracunaj()">UGLASI ME</button>
    </div>

    <div id="rezultat" style="display:none;">
        <p>• Lunarna starost: <b id="r1"></b> let</p>
        <p>• Cikli zorenja (266 dni): <b id="r2"></b></p>
        <p>• Naslednja biološka prenova: <b id="r3"></b></p>
    </div>

    <div class="grid">
        <button class="f-btn" style="background:#2c2c2c" onclick="igraj(174, '174 Hz: Naravni anestetik. Zmanjšuje fizično bolečino in daje organom občutek varnosti.', '#0a0a12')">174 Hz</button>
        <button class="f-btn" style="background:#5e3a00" onclick="igraj(285, '285 Hz: Regeneracija celic in tkiv. Pomaga pri celjenju in obnavljanju energijskega polja.', '#1a1200')">285 Hz</button>
        <button class="f-btn" style="background:#a30000" onclick="igraj(396, '396 Hz: Osvobajanje od strahu in krivde. Odpravlja blokade in omogoča prizemljitev.', '#300000')">396 Hz</button>
        <button class="f-btn" style="background:#d48800; color: #000;" onclick="igraj(417, '417 Hz: Čiščenje travm in negativnosti. Spodbuja spremembe in odpira pot novim začetkom.', '#301a00')">417 Hz</button>
        <button class="f-btn" style="background:#4b4b4b" onclick="igraj(432, '432 Hz: Naravna resonanca vesolja. Prinaša globok notranji mir in jasnost misli.', '#121812')">432 Hz</button>
        <button class="f-btn" style="background:#007a00" onclick="igraj(528, '528 Hz: Frekvenca ljubezni in čudežev. Znana po učinkih na popravljanje DNK in vitalnost.', '#002000')">528 Hz</button>
        <button class="f-btn" style="background:#005c8a" onclick="igraj(639, '639 Hz: Harmonizacija odnosov. Izboljšuje komunikacijo, razumevanje in ljubezen med ljudmi.', '#001420')">639 Hz</button>
        <button class="f-btn" style="background:#0000a3" onclick="igraj(741, '741 Hz: Razstrupljanje telesa in duha. Spodbuja samoizražanje in iskanje resnice.', '#000035')">741 Hz</button>
        <button class="f-btn" style="background:#6a00a3" onclick="igraj(852, '852 Hz: Prebujanje intuicije. Pomaga videti globlji smisel in se vrniti k duhovnemu redu.', '#1d0035')">852 Hz</button>
        <button class="f-btn" style="background:#a300a3" onclick="igraj(963, '963 Hz: Frekvenca bogov / Enosti. Aktivira češariko in povezuje z univerzalno zavestjo.', '#300030')">963 Hz</button>
    </div>

    <button class="stop" onclick="ustavi()">Ustavi zvok in kromoterapijo</button>
    <div id="info">Izberite frekvenco za opis delovanja in barvno uglasitev.</div>

    <div class="sig">KARAT DESIGN SOFT • 2024 • BREZPLAČNO</div>
</div>

<script>
    let avdio = null;
    let oscilator = null;
    let ojacanje = null;

    function igraj(f, opis, barva) {
        if (!avdio) { avdio = new (window.AudioContext || window.webkitAudioContext)(); }
        if (avdio.state === 'suspended') { avdio.resume(); }
        
        ustavi();

        document.body.style.background = barva;
        document.getElementById('info').innerHTML = "<strong>" + opis + "</strong>";

        oscilator = avdio.createOscillator();
        ojacanje = avdio.createGain();
        
        oscilator.type = 'sine';
        oscilator.frequency.value = f;
        
        ojacanje.gain.setValueAtTime(0, avdio.currentTime);
        ojacanje.gain.linearRampToValueAtTime(0.06, avdio.currentTime + 0.1);
        
        oscilator.connect(ojacanje);
        ojacanje.connect(avdio.destination);
        oscilator.start();
    }

    function ustavi() {
        if (oscilator) { 
            ojacanje.gain.linearRampToValueAtTime(0, avdio.currentTime + 0.1);
            oscilator.stop(avdio.currentTime + 0.2); 
            oscilator = null; 
        }
        document.body.style.background = "#05070a";
        document.getElementById('info').innerText = "Izberite frekvenco za opis delovanja in barvno uglasitev.";
    }

    function izracunaj() {
        const d = new Date(document.getElementById('datum').value);
        const danes = new Date();
        const razlikaDni = Math.floor((danes - d) / (1000 * 60 * 60 * 24));
        const cikel = Math.floor(razlikaDni / 266) + 1;
        const naslednji = new Date(d);
        naslednji.setDate(d.getDate() + (cikel * 266));

        document.getElementById('r1').innerText = (razlikaDni / 354.37).toFixed(1);
        document.getElementById('r2').innerText = (razlikaDni / 266).toFixed(1);
        document.getElementById('r3').innerText = naslednji.toLocaleDateString('sl-SI');
        document.getElementById('rezultat').style.display = 'block';
    }
</script>

</body>
</html>
